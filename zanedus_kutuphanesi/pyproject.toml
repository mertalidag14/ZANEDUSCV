[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "zanedus"
version = "0.1.0"
description = "ZANEDUS: sifirdan yazilmis, sklearn tarzinda kucuk bir AutoML kutuphanesi (ZANEDUSCV projesinin yan parcasi)"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.23",
    "pandas>=1.5",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
include = ["zanedus*"]
