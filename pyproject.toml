[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "zaneduscv"
version = "0.1.0"
description = "sklearn tarzinda AutoML kutuphanesi"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.23",
    "pandas>=1.5",
    "scikit-learn>=1.2",
    "joblib>=1.2",
]

[project.optional-dependencies]
boost = ["xgboost>=1.7", "lightgbm>=4.0", "catboost>=1.2"]
dev = ["pytest>=7"]
all = ["xgboost>=1.7", "lightgbm>=4.0", "catboost>=1.2", "pytest>=7"]

[tool.setuptools.packages.find]
include = ["zaneduscv*"]
