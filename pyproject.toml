[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "zaneduscv"
version = "0.2.0"
description = "ZANEDUSCV: egik bolmeli ve lineer yaprakli, sifirdan yazilmis bir gradient boosting algoritmasi"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.23",
    "pandas>=1.5",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
include = ["zaneduscv*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
